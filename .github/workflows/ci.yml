name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Verify Code Formatting
        run: dotnet format EmployeeDirectory.slnx --verify-no-changes --verbosity normal

      - name: Build Docker image
        run: docker build -t employee-directory:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'employee-directory:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Debug GitHub Context
        run: |
          echo "Repository=${{ github.repository }}"
          echo "Ref=${{ github.ref }}"

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 986948598853.dkr.ecr.us-east-1.amazonaws.com

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag employee-directory:${{ github.sha }} 986948598853.dkr.ecr.us-east-1.amazonaws.com/mno-group-dev-employee-directory:${{ github.sha }}
          docker push 986948598853.dkr.ecr.us-east-1.amazonaws.com/mno-group-dev-employee-directory:${{ github.sha }}

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform init

      # Phase 1: infra only (VPC, EKS, RDS, IAM, ECR, etc). Targeted so the
      # kubernetes_manifest resources below aren't planned yet — on a first
      # run against a fresh account, the EKS cluster doesn't exist until
      # this step completes, and the kubernetes provider can't reach a
      # cluster that isn't there yet.
      - name: Terraform Apply - Infra
        run: |
          terraform apply -auto-approve \
            -var-file=dev.tfvars \
            -var="image_tag=${{ github.sha }}" \
            -target=module.network \
            -target=module.security \
            -target=module.data \
            -target=module.iam \
            -target=module.compute \
            -target=module.eks \
            -target=module.lb_controller_irsa \
            -target=module.ecr \
            -target=module.app_irsa \
            -target=module.notifications \
            -target=module.ci_oidc

      # Phase 2: full apply. Infra already exists (or was a no-op above), so
      # the kubernetes provider can now reach the cluster to apply the
      # ServiceAccount, Deployment, and Service manifests.
      - name: Terraform Apply - Full (incl. app manifests)
        run: |
          terraform apply -auto-approve \
            -var-file=dev.tfvars \
            -var="image_tag=${{ github.sha }}"

      - name: Verify rollout
        run: |
          aws eks update-kubeconfig --name mno-group-dev-eks --region us-east-1
          kubectl rollout status deployment/employee-directory --timeout=180s
          kubectl get pods -o wide
