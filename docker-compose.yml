services:
  app:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-local}
    ports:
      - "8080:8080"
    environment:
      Storage__Provider: ${STORAGE_PROVIDER:-Json}
      ConnectionStrings__Default: ${CONNECTION_STRING:-}

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: employeedirectory
      MYSQL_USER: appuser
      MYSQL_PASSWORD: devpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: ["mysql"]

volumes:
  mysql-data: